name: Claude

on:
  issue_comment:
    types: [ created ]
  pull_request_review_comment:
    types: [ created ]
  pull_request_review:
    types: [ submitted ]
  issues:
    types: [ opened, assigned ]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # `CLAUDE.md` imports the `source-sdk` skill from this submodule; the heavy
      # `thirdparty/` submodules are not needed to answer reviews.
      - name: Checkout skills
        run: git submodule update --init --depth 1 external/skills

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          # Set one of these repository secrets: `CLAUDE_CODE_OAUTH_TOKEN`
          # (from `claude setup-token`, uses a Claude subscription) or `ANTHROPIC_API_KEY`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
