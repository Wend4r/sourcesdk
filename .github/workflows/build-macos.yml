name: Build / macOS

on:
  push:
    branches: [ "main" ]
    paths: &paths
      - '.github/workflows/build-macos.yml'
      - 'cmake/**'
      - 'common/**'
      - 'devtools/bin/osx64/**'
      - 'entity2/**'
      - 'game/server/**'
      - 'game/shared/**'
      - 'interfaces/**'
      - 'kv3lib/**'
      - 'lib/osx64/**'
      - 'mathlib/**'
      - 'networksystem/**'
      - 'public/**'
      - 'sym/**'
      - 'tests/**'
      - 'thirdparty/**'
      - 'tier1/**'
      - 'CMakeGameManifests.json'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
  pull_request:
    branches: [ "main" ]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Clang - ${{ matrix.runner.arch }} runner - ${{ matrix.config }}
    runs-on: ${{ matrix.runner.os }}

    strategy:
      matrix:
        # The SDK only builds for x86_64; on the arm64 runner its tests run under Rosetta, which takes seconds per
        # test executable, so they run natively on the Intel runner instead
        runner:
          - os: macos-latest
            arch: arm64
            test: false
          - os: macos-15-intel
            arch: x86_64
            test: true
        config: [ Debug ]
      fail-fast: false

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Fetch submodules
      run: git submodule update --init --depth 1 thirdparty/protobuf thirdparty/game_protobufs

    - name: Install packages
      run: brew install ninja

    - name: Set up environment variables
      run: |
        echo "LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo none)" >> "$GITHUB_ENV"

    - name: Configure CMake
      run: cmake --preset ${{ matrix.config }} -DSOURCESDK_MALLOC_OVERRIDE=ON

    - name: Build
      run: cmake --build --preset ${{ matrix.config }} --parallel

    - name: Test
      if: matrix.config == 'Debug' && matrix.runner.test
      run: ctest --preset ${{ matrix.config }}

    # Both runners build the same x86_64 libraries, upload them once
    - name: Upload build artifact
      if: matrix.runner.test
      uses: actions/upload-artifact@v7
      with:
        name: ${{ github.event.repository.name }}-${{ env.LATEST_TAG }}-${{ runner.os }}-Clang-${{ matrix.config }}
        path: build/Darwin/${{ matrix.config }}/*.a
