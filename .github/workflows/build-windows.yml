name: Build / Windows

on:
  push:
    branches: [ "main" ]
    paths: &paths
      - '.github/workflows/build-windows.yml'
      - 'cmake/**'
      - 'common/**'
      - 'devtools/bin/win64/**'
      - 'entity2/**'
      - 'game/server/**'
      - 'game/shared/**'
      - 'interfaces/**'
      - 'kv3lib/**'
      - 'lib/win64/**'
      - 'mathlib/**'
      - 'networksystem/**'
      - 'public/**'
      - 'sym/**'
      - 'tests/**'
      - 'thirdparty/**'
      - 'tier1/**'
      - 'CMakeGameManifests.json'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
  pull_request:
    branches: [ "main" ]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: MSVC - ${{ matrix.config }}
    runs-on: windows-2022

    strategy:
      matrix:
        config: [ Debug, Release ]
      fail-fast: false

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Fetch submodules
      run: git submodule update --init --depth 1 thirdparty/protobuf thirdparty/game_protobufs

    - name: Set up environment variables
      run: |
        echo "LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo none)" >> "$GITHUB_ENV"

    - name: Configure CMake
      run: cmake --preset VisualStudio

    - name: Build
      run: cmake --build --preset 'VisualStudio\${{ matrix.config }}' --parallel

    - name: Test
      if: matrix.config == 'Debug'
      run: ctest --preset 'VisualStudio\${{ matrix.config }}'

    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ github.event.repository.name }}-${{ env.LATEST_TAG }}-${{ runner.os }}-MSVC-VisualStudio-${{ matrix.config }}
        path: build/Windows/VisualStudio/${{ matrix.config }}/*
