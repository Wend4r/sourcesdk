name: Build / Linux

on:
  push:
    branches: [ "main" ]
    paths: &paths
      - '.github/workflows/build-linux.yml'
      - 'cmake/**'
      - 'common/**'
      - 'devtools/bin/linuxsteamrt64/**'
      - 'entity2/**'
      - 'game/server/**'
      - 'game/shared/**'
      - 'interfaces/**'
      - 'kv3lib/**'
      - 'lib/linuxsteamrt64/**'
      - 'mathlib/**'
      - 'networksystem/**'
      - 'public/**'
      - 'sym/**'
      - 'tests/**'
      - 'thirdparty/**'
      - 'tier1/**'
      - 'CMakeGameManifests.json'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
  pull_request:
    branches: [ "main" ]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.compiler.display_name }} - ${{ matrix.config }}
    runs-on: ubuntu-latest
    container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk

    strategy:
      matrix:
        compiler:
          - name: GCC
            display_name: GCC 14
            packages: gcc-14 g++-14 gcc-14-monolithic
            cc: gcc-14
            cxx: g++-14
          - name: Clang
            display_name: Clang 22
            packages: clang-22 gcc-14-monolithic
            cc: clang-22
            cxx: clang++-22
        config: [ Debug ]
      fail-fast: false

    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Fetch submodules
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git submodule update --init --depth 1 thirdparty/protobuf thirdparty/game_protobufs

    # Bullseye is EOL: its Release files are expired, which makes "apt update" fail
    - name: Ignore expired APT release files
      run: |
        {
          echo 'Acquire::Check-Valid-Until "false";'
          echo 'Acquire::AllowReleaseInfoChange::Suite "true";'
          echo 'Acquire::AllowReleaseInfoChange::Version "true";'
        } | sudo tee /etc/apt/apt.conf.d/99-ci-ignore-expired-release

    # Bullseye security suites are dropped from deb.debian.org (packages 404 on install)
    # and are not on archive.debian.org yet, so disable them
    - name: Disable dropped Bullseye security suites
      run: |
        for list in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
          [ -f "$list" ] || continue
          sudo sed -i -E 's@^[[:space:]]*deb(-src)?[[:space:]].*deb\.debian\.org/debian-security.*@# & (disabled: bullseye EOL)@' "$list"
        done

    - name: Add LLVM repository
      if: matrix.compiler.name == 'Clang'
      run: |
        echo "deb http://apt.llvm.org/bullseye/ llvm-toolchain-bullseye-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc

    - name: Install packages
      run: |
        sudo apt update
        sudo apt install -y cmake ninja-build ${{ matrix.compiler.packages }}

    - name: Set up environment variables
      run: |
        echo "LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo none)" >> "$GITHUB_ENV"

    - name: Set up environment variables for Clang
      if: matrix.compiler.name == 'Clang'
      run: |
        echo "CPLUS_INCLUDE_PATH=/usr/lib/gcc-14/x86_64-linux-gnu/include/c++/14:/usr/lib/gcc-14/x86_64-linux-gnu/include/c++/14/x86_64-linux-gnu:/usr/lib/gcc-14/x86_64-linux-gnu/include/c++/14/backward" >> "$GITHUB_ENV"
        echo "LIBRARY_PATH=/usr/lib/gcc-14/lib/gcc/x86_64-linux-gnu/14" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=/usr/lib/gcc-14/lib/gcc/x86_64-linux-gnu/14" >> "$GITHUB_ENV"

    - name: Configure CMake
      run: cmake --preset ${{ matrix.config }} -DSOURCESDK_MALLOC_OVERRIDE=ON

    - name: Build
      run: cmake --build --preset ${{ matrix.config }} --parallel

    - name: Test
      if: matrix.config == 'Debug'
      run: ctest --preset ${{ matrix.config }}

    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ github.event.repository.name }}-${{ env.LATEST_TAG }}-${{ runner.os }}-${{ matrix.compiler.name }}-${{ matrix.config }}
        path: build/Linux/${{ matrix.config }}/*.a
